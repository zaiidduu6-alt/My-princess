<style>
:root{--paper:#f4efe4;--ink:#6d645c;--blue:#7f95bb;--script:"Mrs Saint Delafield","Snell Roundhand",cursive;--hand:"Gaegu","Bradley Hand",cursive;
--gy:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 4px,transparent 4px 8px),repeating-linear-gradient(0deg,rgba(255,255,255,.45) 0 4px,transparent 4px 8px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{overflow-x:hidden;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;overflow-x:hidden;font-family:var(--hand);color:var(--ink);background-color:#fbfcff;
background-image:linear-gradient(90deg,rgba(160,190,232,.55) 50%,transparent 50%),linear-gradient(rgba(160,190,232,.55) 50%,transparent 50%);
background-size:48px 48px;-webkit-tap-highlight-color:transparent}
/* ===== intro ===== */
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);background-color:#fbfcff;background-image:linear-gradient(90deg,rgba(160,190,232,.55) 50%,transparent 50%),linear-gradient(rgba(160,190,232,.55) 50%,transparent 50%);background-size:48px 48px;transition:opacity .9s ease,transform .9s ease;cursor:pointer}
#intro.out{opacity:0;transform:scale(1.04);pointer-events:none}
.env{position:relative;width:min(94vw,440px);aspect-ratio:340/220}
.env svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.card{position:absolute;left:25%;top:7%;width:43%;height:43%;background:#fdfbf6;border-radius:2px;box-shadow:0 1px 5px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--script);font-size:clamp(20px,6.6vw,32px);line-height:.92;color:#5b5666}
.click{margin-top:14px;font-family:var(--hand);font-size:15px;color:#333;background:#fffdf8;padding:1px 8px;border-radius:2px}
/* ===== site ===== */
#site{display:none;overflow-x:clip;padding:22px 12px 56px;max-width:900px;margin:0 auto}
#site.on{display:block;animation:fade .9s ease}
@keyframes fade{from{opacity:0}}
section{margin:0 auto 54px;position:relative}
p{margin:0;font-size:clamp(13px,3.3vw,19px);line-height:1.3;font-weight:400}
.ph{position:relative;overflow:hidden;background:#e7e0d2;aspect-ratio:1/1}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block}
.fr5 .ph{background:#161616}
.ph.fill img{object-fit:cover}
.ph.empty::after{content:"Photo " attr(data-slot);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#a39a89}
.tape{position:absolute;width:15%;height:7%;min-width:34px;background:rgba(250,232,150,.8)}
.star{position:absolute;width:15%;aspect-ratio:1;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);background:var(--gy),#f3c640}
/* book */
.bookw{container-type:inline-size;width:min(97vw,780px);margin:0 auto 64px;position:relative;left:50%;transform:translateX(-50%)}
.book{display:grid;grid-template-columns:1fr 1fr;position:relative;background:#e9e4d8;border-radius:1.5cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.22),inset 0 0 0 .3cqw #d8d2c3;min-height:66cqw}
.bp{position:relative;background:var(--paper);margin:.8cqw}
.bp.l{border-radius:1.2cqw 0 0 1.2cqw;padding:15cqw 6cqw 6cqw 8cqw;background:linear-gradient(90deg,#f6f2e8,#efeadd)}
.bp.r{border-radius:0 1.2cqw 1.2cqw 0;background:linear-gradient(90deg,#e8e3d6,#f6f2e8 8%)}
.age{font-family:"Fredoka",sans-serif;font-weight:600;font-size:19cqw;color:#f26dac;line-height:.9;display:inline-block}
.cup{font-size:7cqw;vertical-align:top;margin-left:.5cqw}
.b1{font-size:max(12px,3.1cqw);color:var(--blue);line-height:1.3;margin-top:3cqw;text-align:center;width:88%}
.stripe{position:absolute;left:7cqw;top:11cqw;width:4.4cqw;bottom:16cqw;background:#f7d95b}
.polb{position:absolute;left:9cqw;top:14cqw;width:34cqw;background:#fff;padding:1.6cqw 1.6cqw 7cqw;box-shadow:0 .5cqw 2cqw rgba(0,0,0,.25);transform:rotate(-4deg)}
.flower{position:absolute;left:6.4cqw;top:12cqw;font-size:5cqw;z-index:2}
.fav{position:absolute;right:3cqw;top:5cqw;font-family:"Reenie Beanie",cursive;font-size:max(14px,5cqw);color:#c9633b;background:#f1e2c8;padding:0 1.4cqw;transform:rotate(10deg);border-radius:.6cqw;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.2)}
.ily{position:absolute;left:0;right:0;bottom:7cqw;text-align:center;font-size:max(12px,3.1cqw);color:var(--blue)}
.st2{position:absolute;right:7cqw;bottom:12cqw;color:#a7a7a7;font-size:4.2cqw;letter-spacing:.3cqw}
.rings{position:absolute;left:50%;top:0;bottom:0;width:0;z-index:3}
.rings i{position:absolute;left:-3.4cqw;width:6.8cqw;height:2.6cqw;border:.7cqw solid #6c6c6c;border-radius:50%;background:#2d2d2d;box-shadow:inset 0 .3cqw .3cqw #000}
/* page 2 */
.row{display:flex;gap:7%;align-items:center;justify-content:center}
.row+.row{margin-top:46px}
.row>p{flex:1 1 52%;text-align:left;max-width:52%}
.row.flip>p{text-align:right}
.envf{position:relative;flex:0 0 38%;transform:rotate(-2deg)}
.envf::before{content:"";position:absolute;inset:-12% -8% -6% -10%;background:#ecd9ad;transform:rotate(-8deg);clip-path:polygon(0 18%,48% 0,100% 16%,100% 100%,0 100%);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.envf .fr{position:relative;padding:2.6%;background:repeating-linear-gradient(90deg,#d97d86 0 6px,#fff 6px 12px)}
.envf .fr .ph{aspect-ratio:4/3;border:2px solid #fff}
.envf .hrt{position:absolute;left:8%;top:-18%;color:#e58aa0;font-size:18px;z-index:2}
.tp{position:relative;flex:0 0 40%;background:#f3efe6;padding:3%;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.tp .ph{aspect-ratio:4/3}
.tp .tape{left:-6%;bottom:-3%;transform:rotate(-35deg)}.tp .tape.t2{left:auto;right:-6%;top:-3%;bottom:auto;transform:rotate(-35deg)}
.ybow{position:absolute;left:-12%;top:-16%;width:26%;aspect-ratio:3/2;clip-path:polygon(0 0,42% 38%,58% 38%,100% 0,100% 100%,58% 62%,42% 62%,0 100%);background:var(--gy),#f4c93d;transform:rotate(-14deg);z-index:2}
/* film */
.filmwrap{width:min(94vw,820px);margin:0 auto 54px;transform:rotate(1.4deg)}
.strip{display:flex;background:#0f0f10;padding:5.2% 1.2%;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.strip::before,.strip::after{content:"";position:absolute;left:1%;right:1%;height:3%;min-height:7px;background:repeating-linear-gradient(90deg,#f1f1f1 0 55%,transparent 55% 100%);background-size:2.6% 100%;border-radius:2px}
.strip::before{top:1.9%}.strip::after{bottom:1.9%}
.fr5{flex:1;margin:0 .4%;background:#222}
.fr5 .ph{aspect-ratio:3/4}
.bowp{position:absolute;left:-2%;top:-14%;font-size:clamp(28px,8vw,52px);filter:hue-rotate(-15deg);z-index:2}
.filmwrap .star{right:-4%;top:28%;width:9%;z-index:2;transform:rotate(8deg)}
/* final */
.stw{width:min(96vw,800px);margin:0 auto;position:relative;filter:drop-shadow(0 3px 6px rgba(0,0,0,.22))}
.so{-webkit-mask:radial-gradient(circle 6px at 50% 0,#0000 97%,#000) top left/16px 51% repeat-x,radial-gradient(circle 6px at 50% 100%,#0000 97%,#000) bottom left/16px 51% repeat-x;mask:radial-gradient(circle 6px at 50% 0,#0000 97%,#000) top left/16px 51% repeat-x,radial-gradient(circle 6px at 50% 100%,#0000 97%,#000) bottom left/16px 51% repeat-x;width:76%}
.si{-webkit-mask:radial-gradient(circle 6px at 0 50%,#0000 97%,#000) left top/51% 16px repeat-y,radial-gradient(circle 6px at 100% 50%,#0000 97%,#000) right top/51% 16px repeat-y;mask:radial-gradient(circle 6px at 0 50%,#0000 97%,#000) left top/51% 16px repeat-y,radial-gradient(circle 6px at 100% 50%,#0000 97%,#000) right top/51% 16px repeat-y;background:#e9dfca;padding:13% 38% 15% 9%;min-height:260px;text-align:center;display:flex;align-items:center;justify-content:center}
.si p{font-size:clamp(12px,3vw,18px);color:#6b5f52}
.bowr{position:absolute;left:5%;top:5%;font-size:22px;filter:hue-rotate(-30deg) saturate(2)}
.gs{position:absolute;color:#d9a93a;font-size:13px}
.polf{position:absolute;right:3%;top:50%;width:43%;margin-top:-25%;background:#fff;padding:3.2% 3.2% 12%;box-shadow:0 5px 14px rgba(0,0,0,.28);transform:rotate(6deg)}
.polf .ph{aspect-ratio:4/5}
.hg{position:absolute;right:-5%;top:-7%;width:14%;aspect-ratio:1;clip-path:path("M50 90 C-20 40 15 -5 50 25 C85 -5 120 40 50 90Z");background:var(--gy),#e04a52;transform:scale(.55);transform-origin:top right;width:90px;height:90px}
.cass{position:absolute;left:33%;bottom:-9%;width:24%;min-width:92px;aspect-ratio:8/5;background:#4a4a4e;border:2px solid #333;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;transform:rotate(-4deg);cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.3);z-index:2}
.cass span{background:#f1eee6;width:84%;text-align:center;font-size:12px;padding:1px 0;margin-bottom:6%;color:#333}
.cass::before{content:"";position:absolute;top:12%;left:14%;right:14%;height:34%;background:#c9c6bf;border-radius:3px}
.cass.w{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-10deg)}75%{transform:rotate(2deg)}}
.gst{position:absolute;left:-4%;bottom:-10%;width:19%;transform:rotate(-12deg)}
.note{position:absolute;font-size:22px;right:41%;bottom:-6%}
</style>
</head>
<body>

<div id="intro" role="button" tabindex="0" aria-label="Open birthday card">
  <div class="env">
    <svg viewBox="0 0 340 220" aria-hidden="true">
      <polygon points="50,62 160,6 272,62 272,192 50,192" fill="#e4d6b8"/>
      <polygon points="50,62 160,6 272,62" fill="#d8c8a4"/>
      <!-- camera -->
      <rect x="-4" y="102" width="116" height="68" rx="10" fill="#ece8de" stroke="#c7c0b0"/>
      <rect x="8" y="94" width="44" height="12" rx="3" fill="#d6d0c3"/><rect x="82" y="96" width="22" height="9" rx="2" fill="#d6d0c3"/>
      <circle cx="58" cy="138" r="27" fill="#d9d4c8" stroke="#a9a293" stroke-width="3"/>
      <circle cx="58" cy="138" r="18" fill="#2f3944"/><circle cx="58" cy="138" r="10" fill="#4b5c6e"/><circle cx="53" cy="133" r="4" fill="#a9bfd6"/>
      <text x="6" y="118" font-size="8" fill="#777" font-family="sans-serif">Canon</text>
      <!-- envelope front -->
      <polygon points="50,192 50,88 166,152 272,88 272,192" fill="#eadcc0" stroke="#d3c3a0"/>
      <polygon points="50,192 166,124 272,192" fill="#e0d1b0"/>
      <circle cx="160" cy="150" r="3.2" fill="#c9b78f"/>
      <text x="118" y="184" font-size="13" fill="#e0454f">♥</text><text x="132" y="172" font-size="9" fill="#e0454f">♥</text><text x="106" y="172" font-size="8" fill="#e0454f">♥</text>
      <!-- bouquet -->
      <polygon points="248,86 322,92 306,160 262,170" fill="#e2d3b0"/>
      <circle cx="270" cy="96" r="26" fill="#c3d7ef"/><circle cx="296" cy="78" r="13" fill="#7f9c70"/><circle cx="306" cy="116" r="12" fill="#8fb3dc"/>
      <circle cx="282" cy="86" r="14" fill="#f2b93b"/><circle cx="282" cy="86" r="5" fill="#6b4a1f"/>
      <circle cx="308" cy="96" r="12" fill="#f0a82c"/><circle cx="308" cy="96" r="4" fill="#6b4a1f"/>
      <circle cx="258" cy="112" r="11" fill="#f6c94f"/><circle cx="258" cy="112" r="4" fill="#6b4a1f"/>
      <g fill="#fff"><circle cx="262" cy="80" r="2"/><circle cx="318" cy="104" r="2"/><circle cx="294" cy="124" r="2"/><circle cx="270" cy="70" r="2"/></g>
      <!-- ribbon -->
      <g fill="#6f95cf"><polygon points="252,134 280,148 252,166"/><polygon points="308,134 280,148 308,166"/><circle cx="280" cy="148" r="7"/><polygon points="272,154 262,204 276,192"/><polygon points="286,154 296,202 282,192"/></g>
    </svg>
    <div class="card"><span id="t-cover"></span></div>
  </div>
  <div class="click">click me!</div>
</div>

<audio id="song" src="song.mp3" preload="auto" playsinline></audio>

<main id="site">

  <section class="bookw">
    <div class="book">
      <div class="bp l">
        <span class="age" id="t-age"></span><span class="cup">🧁</span>
        <p class="b1" id="t-b1"></p>
      </div>
      <div class="rings"><i style="top:14%"></i><i style="top:46%"></i><i style="top:78%"></i></div>

        <i class="stripe"></i>
        <span class="flower">🌼</span>
        <span class="fav" id="t-fav"></span>
        <div class="polb"><div class="ph" data-slot="1"></div></div>
        <div class="ily" id="t-b2"></div>
        <span class="st2">★★</span>
      </div>
    </div>
  </section>

  <section>
    <div class="row">
      <div class="envf"><span class="hrt">♡</span><div class="fr"><div class="ph" data-slot="2"></div></div></div>
      <p id="t-p1"></p>
    </div>
    <div class="row flip">
      <p id="t-p2"></p>
      <div class="tp"><i class="ybow"></i><i class="tape"></i><i class="tape t2"></i><div class="ph" data-slot="3"></div></div>
    </div>

      <div class="fr5"><div class="ph" data-slot="5"></div></div>
      <div class="fr5"><div class="ph" data-slot="6"></div></div>
      <div class="fr5"><div class="ph" data-slot="7"></div></div>
      <div class="fr5"><div class="ph" data-slot="8"></div></div>
    </div>
  </div>

    <div class="stw">
      <div class="so"><div class="si"><p id="t-p3"></p></div></div>
      <span class="bowr">🎀</span><span class="gs" style="left:44%;top:6%">★</span><span class="gs" style="left:6%;top:48%">★</span><span class="gs" style="left:30%;bottom:8%">★</span>
      <div class="polf"><i class="hg"></i><div class="ph" data-slot="9"></div></div>
      <div class="cass" id="cass"><span>click me!</span></div>
      <i class="star gst"></i><span class="note">🎵</span>
    </div>
    <div style="height:70px"></div>
  </section>

</main>

<script>
/* ===== EDIT TEXT HERE (one place) ===== */
var TEXT = {
  cover: "Happy<br>Birthday<br>Muskuuu",
  age: "19",
  fav: "Favorite person",
  b1: "Happy Birthday babe! Another year of being you, and somehow you keep making life a little better just by being in it ♡",
  b2: "I love you!",
  p1: "It’s kind of funny how a whole year can pass without you even realizing it. There have been so many versions of us packed into these past few months: random plans, stupid jokes, quiet moments, and days that somehow became unforgettable. I hope today reminds you just how loved you are and how much brighter you make the lives of the people around you.",
  p2: "I would keep a little box of everything from this year. It would probably be filled with blurry pictures, ridiculous conversations, tiny surprises, and all the moments that meant more than they seemed to at the time. For now, I just want you to enjoy being celebrated today because you absolutely deserve it ♥",
  p3: "And just like that, another little chapter becomes a memory. I hope you always remember how loved you are, not just today, but in all the ordinary moments in between. Here’s to late-night conversations, silly pictures, unexpected adventures, and all the memories we haven’t made yet. Whatever comes next, I’m really glad I get to be a part of it."
};
/* ===== PHOTOS: slot number -> image path or data URL (empty = frame stays empty) ===== */
var SLOTS = {
1:"photo1.mp4",
2:"photo2.jpg",
3:"photo3.mp4",
4:"photo4.jpg",
5:"photo5.jpg",
6:"photo6.jpg",
7:"photo7.jpg",
8:"photo8.jpg",
9:"photo9.jpg"
};
/* slots that fill their frame completely (slight crop): object-position keeps faces in view */
var FILL = {4:"60% 50%",7:"30% 50%"};
/* video poster images */
var POSTERS = {1:"photo1-poster.jpg",3:"photo3-poster.jpg"};
/* focus point per frame (object-position) */
var POS = {"1": "45% 50%", "2": "50% 50%", "3": "50% 50%", "4": "50% 60%", "5": "50% 50%", "6": "50% 40%", "7": "80% 50%", "8": "50% 50%", "9": "50% 30%"};

for (var k in TEXT){var e=document.getElementById("t-"+k);if(e)e.innerHTML=TEXT[k];}
document.querySelectorAll(".ph").forEach(function(el){
  var s=SLOTS[el.dataset.slot];
  if(s&&/\.(mp4|webm|mov)$/i.test(s)){var v=document.createElement("video");v.src=s;v.poster=POSTERS[el.dataset.slot]||"";v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.setAttribute("playsinline","");v.setAttribute("muted","");el.appendChild(v);v.play().catch(function(){});}
  else if(s){var i=new Image();if(FILL[el.dataset.slot]){el.classList.add("fill");i.style.objectPosition=FILL[el.dataset.slot];}i.src=s;i.alt="";el.appendChild(i);}else el.classList.add("empty");
});
var intro=document.getElementById("intro"),site=document.getElementById("site");
/* ===== SONG: starts at 0:33 on the first interaction (browsers block sound before one), keeps playing across the whole visit ===== */
var SONG_START=33,song=document.getElementById("song"),songOn=false;
function startSong(){
  if(songOn)return;songOn=true;
  var seeked=false,seek=function(){
    if(seeked)return;
    try{if(song.readyState>=1&&song.seekable.length&&song.seekable.end(0)>=SONG_START){song.currentTime=SONG_START;seeked=true;}}catch(e){}
  };
  seek();["loadedmetadata","canplay","progress","playing"].forEach(function(ev){song.addEventListener(ev,seek);});
  var pr=song.play();
  if(pr&&pr.catch)pr.catch(function(){songOn=false;});
}
song.addEventListener("ended",function(){song.currentTime=SONG_START;song.play().catch(function(){});});
["pointerdown","touchend","keydown","click"].forEach(function(ev){document.addEventListener(ev,startSong,{passive:true});});
song.play().then(function(){songOn=true;if(song.currentTime<SONG_START-1)song.currentTime=SONG_START;}).catch(function(){});
function openIt(){startSong();site.classList.add("on");window.scrollTo(0,0);intro.classList.add("out");setTimeout(function(){intro.style.display="none"},950);}
intro.addEventListener("click",openIt);
intro.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" ")openIt();});
var c=document.getElementById("cass");
c.addEventListener("click",function(){c.classList.remove("w");void c.offsetWidth;c.classList.add("w");});
</script>
